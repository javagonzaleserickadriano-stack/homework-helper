<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TareaFast - Tu Profe IA 🇵🇪</title>
<style>
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-family:sans-serif;text-align:center;padding:20px;min-height:100vh}
textarea{width:90%;height:80px;padding:10px;border-radius:8px;border:0;margin:10px}
button{width:95%;padding:12px;background:#ff6b6b;color:#fff;border:0;border-radius:8px;font-size:16px}
#r{margin-top:15px;padding:15px;background:rgba(255,255,255,.2);border-radius:8px;min-height:40px;text-align:left}
</style>
</head>
<body>
<h1 style="font-size:32px">
<div style="background:#fff;width:60px;height:60px;border-radius:15px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:35px;box-shadow:0 4px 10px rgba(0,0,0,0.2)">🎓</div>
TareaFast
</h1>
<p style="font-size:14px;margin-top:-5px;opacity:0.9">Tu profe de IA que explica paso a paso</p>
<textarea id="q" placeholder="Escribe tu tarea..."></textarea><br>
<button onclick="go()">Resolver</button>
<div id="r">La respuesta aparece aquí...</div>
<script>
async function go(){
const API_KEY='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 ';
const q=document.getElementById('q').value;
const r=document.getElementById('r');
if(!q){r.innerText='Escribe una pregunta';return}
r.innerText='Pensando...';
try{
const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
body:JSON.stringify({
model:'llama-3.1-8b-instant',
messages:[{role:'system',content:'Eres profesor peruano. Explica paso a paso con emojis. Nunca des solo la respuesta.'},{role:'user',content:q}]
})});
const data=await res.json();
r.innerText=data.choices[0].message.content
}catch(e){r.innerText='Error. Revisa tu API Key'}
}
</script>
</body>
</html>
