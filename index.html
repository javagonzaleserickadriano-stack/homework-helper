<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homework Helper</title>
<style>
body{background:#667eea;color:#fff;font-family:Arial;text-align:center;padding:20px}
textarea{width:90%;height:80px;padding:10px;border-radius:8px;border:0;margin:10px}
button{width:95%;padding:12px;background:#ff6b6b;color:#fff;border:0;border-radius:8px;font-size:16px}
#r{margin-top:15px;padding:15px;background:rgba(255,255,255,.2);border-radius:8px;min-height:40px;text-align:left}
</style>
</head>
<body>
<h1>📚 Homework Helper</h1>
<textarea id="q" placeholder="Escribe tu tarea..."></textarea><br>
<button onclick="go()">Resolver</button>
<div id="r">La respuesta aparece aquí...</div>
<script>
async function go(){
const API='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 ';
const q=document.getElementById('q').value;
const r=document.getElementById('r');
if(!q){r.innerText='Escribe una pregunta';return}
r.innerText='Pensando...';
try{
const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+API},
body:JSON.stringify({
model:'llama-3.1-8b-instant',
messages:[{role:'user',content:'Responde en español simple: '+q}]
})});
const data=await res.json();
r.innerText=data.choices[0].message.content
}catch(e){r.innerText='Error. Revisa tu API Key'}
}
</script>
</body>
</html>
